name: Build and Deploy bo3-multiples-pricing

on:
  # push to deploy-ready: builds and creates an UNRELEASED app version (--no-release).
  # push to release:      RELEASES the app version to the store (--allow-updates). Push only after Cheyne says yes.
  # manual dispatch:      releases unless no_release is ticked.
  push:
    branches:
      - deploy-ready
      - release
  workflow_dispatch:
    inputs:
      no_release:
        description: "Create the app version but do not release it (passes --no-release)"
        type: boolean
        required: false
        default: false

# Two deploys never overlap, and a running deploy is never cancelled mid-way.
concurrency:
  group: bo3-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install root dependencies
        run: npm install

      - name: Install extension dependencies
        run: cd extensions/bo3-multiples-pricing && npm install

      - name: Test function
        run: cd extensions/bo3-multiples-pricing && npm test

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli@4

      - name: Fetch function schema
        env:
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
          SHOPIFY_CLI_TTY: "0"
          NO_COLOR: "1"
          CI: "true"
        run: |
          cd extensions/bo3-multiples-pricing
          if ! shopify app function schema --no-input --no-color; then
            echo "::error::Could not fetch schema.graphql with shopify app function schema. Check that the SHOPIFY_APP_AUTOMATION_TOKEN secret is set and valid for this app, or commit a schema.graphql generated by a logged-in run."
            exit 1
          fi
          test -s schema.graphql || { echo "::error::schema.graphql is missing or empty after the schema step."; exit 1; }

      - name: Deploy to Shopify
        env:
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
          SHOPIFY_FLAG_STORE: td5h8u-tb.myshopify.com
          SHOPIFY_CLI_TTY: "0"
          NO_COLOR: "1"
          CI: "true"
          # Fails closed: --no-release unless this run is explicitly a release
          # (push to the release branch, or a dispatch with no_release unticked).
          NO_RELEASE: ${{ !((github.event_name == 'push' && github.ref == 'refs/heads/release') || (github.event_name == 'workflow_dispatch' && inputs.no_release == false)) }}
        run: |
          # --no-release and --allow-updates are mutually exclusive in the CLI usage line.
          if [ "$NO_RELEASE" = "true" ]; then
            shopify app deploy --no-release --no-color
          else
            shopify app deploy --allow-updates --no-color
          fi

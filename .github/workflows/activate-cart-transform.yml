name: Activate cart transform

# Runs only on a push to the activate branch (push only after Cheyne says yes)
# or by hand with confirm = ACTIVATE. Never on any other branch, push or pull request.
on:
  push:
    branches:
      - activate
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type ACTIVATE to confirm"
        type: string
        required: true

# Shared with the deploy workflow so the two never overlap.
concurrency:
  group: bo3-deploy
  cancel-in-progress: false

jobs:
  activate:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/activate') || (github.event_name == 'workflow_dispatch' && inputs.confirm == 'ACTIVATE') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Activate cart transform
        env:
          # Push to activate counts as the confirmation; dispatch must have typed ACTIVATE (checked by the job condition and the script).
          CONFIRM: ${{ github.event_name == 'push' && 'ACTIVATE' || inputs.confirm }}
          # Public client id of the app, not a secret.
          SHOPIFY_API_KEY: b6ef0586e8f3f9038f0397c65d866dbd
          SHOPIFY_API_SECRET: ${{ secrets.SHOPIFY_API_SECRET }}
        run: node scripts/activate-cart-transform.mjs

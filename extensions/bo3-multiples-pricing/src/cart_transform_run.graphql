query CartTransformRunInput {
  presentmentCurrencyRate
  cart {
    buyerIdentity {
      customer {
        hasTags(tags: ["twin", "twins", "twin-fam", "amba-twin", "triplet", "triplets", "triplet-fam", "amba-triplet", "amba-quad", "hero", "quad", "quads", "amba", "amba-member"]) {
          tag
          hasTag
        }
      }
    }
    lines {
      id
      quantity
      merchandise {
        __typename
        ... on ProductVariant {
          id
          product {
            id
            inCollections(ids: ["gid://shopify/Collection/330356261047"]) {
              collectionId
              isMember
            }
            metafield(namespace: "custom", key: "cost_price") {
              value
            }
          }
        }
      }
      cost {
        amountPerQuantity {
          amount
          currencyCode
        }
      }
    }
  }
}
